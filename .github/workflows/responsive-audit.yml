name: Responsive collision audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  responsive-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Audit source image inventory
        run: npm run audit:images

      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium

      - name: Build production site
        run: npm run build

      - name: Start production server
        run: |
          npm start -- -p 3000 > /tmp/portfolio-server.log 2>&1 &
          for attempt in {1..60}; do
            if curl --silent --fail http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/portfolio-server.log
          exit 1

      - name: Audit responsive layouts
        run: node scripts/responsive-audit.mjs

      - name: Audit minimum font size
        run: node scripts/font-size-audit.mjs

      - name: Audit image-caption alignment
        run: node scripts/image-caption-audit.mjs

      - name: Audit column spacing
        run: node scripts/column-spacing-audit.mjs

      - name: Audit rendered text columns
        run: node scripts/text-column-audit.mjs

      - name: Audit brand and content consistency
        run: node scripts/brand-consistency-audit.mjs

      - name: Audit neon green and gunmetal palette
        run: node scripts/palette-audit.mjs

      - name: Audit image motion quality and numbering
        run: node scripts/image-motion-audit.mjs

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-audit-failures
          path: |
            artifacts/responsive-audit
            artifacts/image-caption-audit
            artifacts/column-spacing-audit
            artifacts/text-column-audit
            artifacts/brand-consistency-audit
            artifacts/palette-audit
            artifacts/image-motion-audit
          if-no-files-found: ignore
          retention-days: 7
